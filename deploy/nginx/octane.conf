# Install as /etc/nginx/conf.d/octane.conf, or adapt it to your distribution's
# sites-available/sites-enabled layout. Replace the server_name value before
# exposing this virtual host publicly.

upstream octane_origin {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://octane_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_request_buffering on;
        proxy_buffering on;

        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
